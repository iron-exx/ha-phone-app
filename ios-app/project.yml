name: HAPhoneTestApp
options:
  bundleIdPrefix: de.haphone.app
  deploymentTarget:
    iOS: "17.0"
  # `brew install xcodegen` always grabs the latest release, whose default
  # project format (objectVersion 77, XcodeGenKit's ProjectFormat.xcode16_0
  # since 2.43.0) is newer than the ios-ci.yml runner's pinned Xcode 15.4 --
  # xcodebuild refuses to open it ("future Xcode project file format 77").
  # Pin the generated project to the 15.x-compatible format (objectVersion
  # 63) instead of chasing whatever Xcode version XcodeGen assumes next.
  projectFormat: xcode15_3
targets:
  HAPhoneTestApp:
    type: application
    platform: iOS
    sources: [HAPhoneTestApp]
    info:
      path: HAPhoneTestApp/Info.plist
      properties:
        UIBackgroundModes: [voip]
        # Real HA-Phone test-extension credentials (02-05, credential
        # substitution) flow in via Secrets.xcconfig's build settings, never
        # as Swift string literals in tracked source -- read at runtime via
        # Bundle.main in HAPhoneTestAppApp.swift.
        SIPTestHost: $(SIP_TEST_HOST)
        SIPTestPort: $(SIP_TEST_PORT)
        SIPTestUsername: $(SIP_TEST_USERNAME)
        SIPTestPassword: $(SIP_TEST_PASSWORD)
    entitlements:
      path: HAPhoneTestApp/HAPhoneTestApp.entitlements
      properties:
        aps-environment: development
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.haphone.app.test
        CODE_SIGN_STYLE: Automatic
        HEADER_SEARCH_PATHS: "$(SRCROOT)/third_party/pjproject/pjsip/include $(SRCROOT)/third_party/pjproject/pjlib/include $(SRCROOT)/third_party/pjproject/pjmedia/include $(SRCROOT)/third_party/pjproject/pjnath/include $(SRCROOT)/third_party/pjproject/pjlib-util/include $(SRCROOT)/third_party/pjproject/pjsip-apps/src/pjsua2/include"
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"
        CLANG_ENABLE_MODULES: NO
        # PjsuaBridge (Obj-C++, wraps PJSUA2's C++ Endpoint/Account/Call) is
        # invisible to Swift without this -- Swift can only see Objective-C
        # types via a bridging header or a Clang module, and CLANG_ENABLE_MODULES
        # is NO above (C++ interop + modules don't mix reliably here). Without
        # it, SipCallOperations.swift/SipCallController.swift fail with
        # "cannot find type 'PjsuaBridge' in scope".
        SWIFT_OBJC_BRIDGING_HEADER: "HAPhoneTestApp/HAPhoneTestApp-Bridging-Header.h"
        # build_pjsip_ios.sh only builds an arm64 Simulator slice (matching
        # this Apple Silicon runner; see that script's comments for why
        # x86_64 isn't needed). ios-ci.yml's `-destination 'generic/platform=iOS
        # Simulator'` otherwise asks Xcode to build every simulator arch
        # (arm64 AND x86_64) it knows about, and the link fails since the
        # xcframework has no x86_64 slice to offer.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: "x86_64"
        # PJSIP's pjmedia-codec archive only compiles in opus.c's *references* to
        # the opus_* symbols -- the actual libopus implementation is never bundled
        # into the xcframework (build_pjsip_ios.sh links against Homebrew's opus
        # at PJSIP-build time, but static archives don't resolve external symbols
        # until final link). Without this, the app binary itself fails the exact
        # same "Undefined symbols ... _opus_encode" link error the PJSIP build
        # script hit. Hardcoded to Homebrew's Apple Silicon prefix since GitHub's
        # macos-14 CI runners are arm64; adjust for Intel Macs (/usr/local) if
        # building locally on an older machine.
        LIBRARY_SEARCH_PATHS: "/opt/homebrew/opt/opus/lib"
        OTHER_LDFLAGS: "-lopus"
    dependencies:
      - framework: Frameworks/pjsua2.xcframework
        embed: false
    scheme:
      testTargets: [HAPhoneTestAppTests]
  HAPhoneTestAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HAPhoneTestAppTests]
    dependencies:
      - target: HAPhoneTestApp
