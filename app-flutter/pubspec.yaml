name: ha_phone_test
description: >
  HA-Phone companion softphone. Flutter UI/business-logic layer over the
  native PJSIP/Telecom/CallKit call-handling code (see android/app/.../sip/
  and, for iOS, a future platform-channel port of ios-app's Swift PJSIP/
  CallKit layer -- not yet built, see the Phase 1 plan).
publish_to: 'none'
version: 0.7.3+11

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^5.2.3
  http: ^1.2.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.3
  just_audio: ^0.9.46
  flutter_contacts: ^1.1.9+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/BricolageGrotesque-OFL.txt
    - assets/fonts/Manrope-OFL.txt
  # "Nachtwache" design system fonts (SIL OFL, licences next to the files).
  # Static instances cut from the google/fonts variable TTFs (Bricolage at
  # opsz 32, wdth 100) so every weight renders without variation axes.
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
